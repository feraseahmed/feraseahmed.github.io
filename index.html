    pin: SV + '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    mail: SV + '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>',
    li: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>',
    copy: '<svg class="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    check: '<svg class="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
  };
  function contactItems(c){
    return '<span class="ci">' + IC.mail + '<a href="mailto:' + escAttr(c.email) + '">' + esc(c.email) + '</a>'
        + '<button class="copy-btn" type="button" data-copy="' + escAttr(c.email) + '" aria-label="Copy email" title="Copy email">' + IC.copy + IC.check + '</button></span>'
      + '<span class="ci">' + IC.li + '<a href="' + escAttr(c.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a></span>'
      + '<span class="ci">' + IC.pin + '<span>' + esc(c.location) + '</span></span>';
  }
  function bulletList(items){ return '<ul class="plain">' + items.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'; }

  function renderHero(s){
    return '<div class="wrap hero">'
      + '<p class="kicker">' + esc(s.hero.role) + '</p>'
      + '<h1>' + esc(s.hero.name) + '</h1>'
      + '<p class="org">' + esc(s.hero.org) + '</p>'
      + '<p class="lede">' + esc(s.hero.lede) + '</p>'
      + '<div class="contact-line">' + contactItems(s.contact) + '</div></div>';
  }
  function renderAbout(s){
    var stats = s.about.stats.map(function(st){
      return '<div class="stat-cell"><b class="stat-num">' + esc(st.value) + '</b><span class="stat-label">' + esc(st.label) + '</span></div>';
    }).join("");
    return '<section id="about" class="reveal"><div class="wrap"><h2>About</h2>'
      + '<p>' + esc(s.about.p1) + '</p><p>' + esc(s.about.p2) + '</p><p>' + esc(s.about.p3) + '</p>'
      + '<div class="stats-row">' + stats + '</div></div></section>';
  }
  function renderExperience(s){
    var e = s.experience;
    return '<section id="experience" class="reveal"><div class="wrap"><h2>Experience</h2>'
      + '<div class="role-head"><h3>' + esc(e.title) + '</h3><span class="dates">' + esc(e.dates) + '</span></div>'
      + '<div class="role-sub">' + esc(e.sub) + '</div>' + bulletList(e.bullets) + '</div></section>';
  }
  function renderProjects(s){
    var cards = s.projects.map(function(p){
      return '<article class="proj-card">'
        + '<div class="role-head" style="margin-top:0;"><h3>' + esc(p.title) + '</h3><span class="dates">' + esc(p.dates) + '</span></div>'
        + '<div class="role-sub">' + esc(p.sub) + '</div>'
        + '<span class="tag-pill">' + esc(p.tag) + '</span>'
        + '<details class="proj-details"><summary>Details</summary>' + bulletList(p.bullets) + '</details></article>';
    }).join("");
    return '<section id="projects" class="reveal"><div class="wrap"><h2>Key projects</h2><div class="proj-grid">' + cards + '</div></div></section>';
  }
  function renderCredentials(s){
    var c = s.credentials;
    var conf = c.conferences.map(function(cf){ return '<li><span class="when">' + esc(cf.when) + '</span><span>' + esc(cf.text) + '</span></li>'; }).join("");
    var certs = c.certs.map(function(t){ return '<div class="badge">' + esc(t) + '</div>'; }).join("");
    return '<section id="credentials" class="reveal"><div class="wrap"><h2>Credentials</h2><div class="cred-grid">'
      + '<div class="cred-block"><h3>Education</h3><div class="edu-block">'
        + '<p style="color:var(--ink); font-size:.98rem; margin:0;"><b>' + esc(c.eduDegree) + '</b></p>'
        + '<p>' + esc(c.eduSchool) + '<br>' + esc(c.eduDates) + '</p></div>'
        + '<h3 style="margin-top:1.8rem;">Certifications</h3><div class="badges">' + certs + '</div></div>'
      + '<div class="cred-block"><h3>Conferences</h3><ul class="conf-list">' + conf + '</ul></div>'
      + '</div></div></section>';
  }
  function renderInterests(s){
    var list = s.interests.list.map(function(t){ return '<li><span class="ltag">LDR</span><span>' + esc(t) + '</span></li>'; }).join("");
    return '<section id="interests" class="reveal"><div class="wrap"><h2>Leadership &amp; Volunteering</h2>'
      + '<ul class="lead-list">' + list + '</ul><p class="fulfillment">' + esc(s.interests.note) + '</p></div></section>';
  }
  function renderReading(s){
    var chips = [["all","All"],["HIS","History"],["PHI","Philosophy"],["LIT","Literature"],["NRG","Energy"]].map(function(c){
      return '<button type="button" class="chip" data-filter="' + c[0] + '" aria-pressed="' + (c[0] === "all") + '">' + c[1] + '</button>';
    }).join("");
    var items = s.reading.items.map(function(it){
      return '<li data-cat="' + escAttr(it.cat) + '"><span class="cat-tag">' + esc(it.cat) + '</span><span>' + esc(it.text) + '</span></li>';
    }).join("");
    return '<section id="reading" class="reveal"><div class="wrap"><h2>Reading</h2><p>' + esc(s.reading.intro) + '</p>'
      + '<div class="chip-row">' + chips + '</div><ul class="reading-list" id="readingList">' + items + '</ul></div></section>';
  }
  function renderFooter(s){
    return '<div class="wrap footer-grid"><div class="contact-info">' + contactItems(s.contact) + '</div>'
      + '<a href="mailto:' + escAttr(s.contact.email) + '" class="ctrl-btn accent" style="text-decoration:none;">Send a message</a></div>'
      + '<div class="wrap fine">' + esc(s.footerTagline) + '</div>';
  }

  var topEl = document.getElementById("top");
  topEl.innerHTML = renderHero(STATE) + renderAbout(STATE) + renderExperience(STATE) + renderProjects(STATE) + renderCredentials(STATE) + renderInterests(STATE) + renderReading(STATE);
  document.getElementById("contact").innerHTML = renderFooter(STATE);

  var reveal = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in-view"); reveal.unobserve(en.target); } });
  }, { threshold: 0.12 });
  topEl.querySelectorAll(".reveal").forEach(function(el){ reveal.observe(el); });

  var navLinks = Array.prototype.slice.call(document.querySelectorAll("[data-section-link]"));
  var nav = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      navLinks.forEach(function(a){ a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id); });
    });
  }, { rootMargin: "-40% 0px -50% 0px", threshold: 0 });
  ["about","experience","projects","credentials","interests","reading","contact"].forEach(function(id){
    var el = document.getElementById(id); if(el) nav.observe(el);
  });

  var toTop = document.getElementById("toTop"), ticking = false;
  function upd(){ toTop.classList.toggle("visible", window.scrollY > window.innerHeight * 0.6); }
  window.addEventListener("scroll", function(){ if(ticking) return; ticking = true; requestAnimationFrame(function(){ upd(); ticking = false; }); });
  upd();

  var root = document.documentElement, stored = null;
  try{ stored = localStorage.getItem("theme"); }catch(e){}
  if(stored === "light" || stored === "dark") root.setAttribute("data-theme", stored);
  document.getElementById("themeToggle").addEventListener("click", function(){
    var cur = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("theme", next); }catch(e){}
  });

  document.addEventListener("click", function(e){
    var btn = e.target.closest(".copy-btn");
    if(btn){
      var done = function(ok){
        if(!ok){ btn.title = "Copy failed"; return; }
        btn.classList.add("copied"); btn.title = "Copied";
        setTimeout(function(){ btn.classList.remove("copied"); btn.title = "Copy email"; }, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(btn.getAttribute("data-copy")).then(function(){ done(true); }, function(){ done(false); });
      else done(false);
      return;
    }
    var chip = e.target.closest(".chip");
    if(chip){
      chip.parentNode.querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c === chip ? "true" : "false"); });
      var f = chip.getAttribute("data-filter");
      document.querySelectorAll("#readingList li").forEach(function(li){ li.hidden = !(f === "all" || li.getAttribute("data-cat") === f); });
    }
  });
})();
</script>
</body>
</html>
